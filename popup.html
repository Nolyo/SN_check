<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Run Monitor</h1>

    <div class="status-section">
      <div class="status-row">
        <span class="label">Status</span>
        <span id="status" class="value">--</span>
      </div>
      <div class="status-row">
        <span class="label">Last check</span>
        <span id="last-check" class="value">--</span>
      </div>
      <div class="status-row">
        <span class="label">Unassigned</span>
        <span id="unassigned-count" class="value badge">0</span>
      </div>
    </div>

    <div class="tickets-section" id="tickets-section" style="display:none">
      <h2>Unassigned tickets</h2>
      <ul id="tickets-list"></ul>
    </div>

    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Monitoring active</span>
      </label>
      <button id="btn-check" class="btn">Check now</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
