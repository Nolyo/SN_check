<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3"></path>
            <path d="M12 18v3"></path>
            <path d="M5.6 5.6l2.1 2.1"></path>
            <path d="M16.3 16.3l2.1 2.1"></path>
            <path d="M3 12h3"></path>
            <path d="M18 12h3"></path>
            <path d="M5.6 18.4l2.1-2.1"></path>
            <path d="M16.3 7.7l2.1-2.1"></path>
            <circle cx="12" cy="12" r="3.2"></circle>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Run Monitor</h1>
          <p class="brand-sub">ServiceNow watcher</p>
        </div>
      </div>
      <span id="status-pill" class="pill pill--muted">
        <span class="pill-dot"></span>
        <span id="status-label">--</span>
      </span>
    </header>

    <section class="metrics" aria-label="Status">
      <div class="metric metric--primary">
        <span class="metric-label">Unassigned</span>
        <span id="unassigned-count" class="metric-value">0</span>
        <span class="metric-sub">
          <span id="assigned-count">0</span> assigned
        </span>
      </div>
      <div class="metric">
        <span class="metric-label">Last check</span>
        <span id="last-check" class="metric-value metric-value--sm">--</span>
      </div>
    </section>

    <div id="scrape-error" class="alert-banner" role="status" hidden>
      <span id="scrape-error-text"></span>
    </div>

    <section class="tickets" id="tickets-section" hidden>
      <div class="tickets-header">
        <h2>Open tickets</h2>
        <span id="tickets-count" class="chip">0</span>
      </div>
      <ul id="tickets-list" class="tickets-list"></ul>
    </section>

    <section class="empty" id="empty-state">
      <span class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
      </span>
      <p class="empty-title">All clear</p>
      <p class="empty-sub">No unassigned tickets right now.</p>
    </section>

    <footer class="controls">
      <label class="toggle">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
        <span class="toggle-text">Monitoring</span>
      </label>
      <button id="btn-check" class="btn" type="button">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <path d="M21 4v5h-5"></path>
          </svg>
        </span>
        <span class="btn-label">Check now</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
