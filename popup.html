<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" data-state="alert">
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <defs>
              <linearGradient id="sweep" x1="16" y1="16" x2="30" y2="6" gradientUnits="userSpaceOnUse">
                <stop stop-color="currentColor" stop-opacity="0.9"></stop>
                <stop offset="1" stop-color="currentColor" stop-opacity="0"></stop>
              </linearGradient>
            </defs>
            <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-opacity="0.22" stroke-width="1"></circle>
            <circle cx="16" cy="16" r="8" stroke="currentColor" stroke-opacity="0.35" stroke-width="1"></circle>
            <circle cx="16" cy="16" r="3" stroke="currentColor" stroke-opacity="0.55" stroke-width="1"></circle>
            <path d="M16 16 L28 8 A13 13 0 0 0 16 3 Z" fill="url(#sweep)"></path>
            <circle cx="16" cy="16" r="1.6" fill="currentColor"></circle>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Run Monitor</h1>
          <p class="brand-sub">ServiceNow &middot; watch</p>
        </div>
      </div>
      <span id="status-pill" class="pill">
        <span class="pill-dot"></span>
        <span id="status-label">--</span>
      </span>
    </header>

    <section class="hero" aria-label="Status">
      <div class="hero-main">
        <div class="hero-label">Unassigned</div>
        <div id="unassigned-count" class="hero-num">00</div>
        <div class="hero-sub">
          <span id="assigned-count">0</span> assigned
        </div>
      </div>
      <div class="hero-side">
        <div class="side-label">Last check</div>
        <div id="last-check" class="side-val">--:--:--</div>
        <div class="spark" id="spark" aria-hidden="true"></div>
      </div>
    </section>

    <div id="scrape-error" class="alert-banner" role="status" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
      </svg>
      <span id="scrape-error-text"></span>
    </div>

    <section class="empty" id="empty-state" hidden>
      <span class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
      </span>
      <div class="empty-text">
        <p class="empty-title">All clear</p>
        <p class="empty-sub">No unassigned tickets right now.</p>
      </div>
    </section>

    <section class="tickets" id="tickets-section" hidden>
      <div class="tickets-header">
        <h2>Open tickets</h2>
        <span id="tickets-count" class="chip">00</span>
      </div>
      <ul id="tickets-list" class="tickets-list"></ul>
    </section>

    <footer class="controls">
      <label class="toggle">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
        <span class="toggle-text">Monitor</span>
      </label>
      <button id="btn-check" class="btn" type="button">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <path d="M21 4v5h-5"></path>
          </svg>
        </span>
        <span class="btn-label">Check now</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
